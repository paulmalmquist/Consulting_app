# Kubernetes ServiceAccount for the sink worker.
# On GKE it is bound to a GCP service account via Workload Identity (see the
# gke-dev overlay annotation), so the pod gets BigQuery access with no key file
# and no GOOGLE_APPLICATION_CREDENTIALS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: winston-bq-sink
  labels:
    app.kubernetes.io/name: winston-bq-sink
    app.kubernetes.io/component: event-sink-worker
