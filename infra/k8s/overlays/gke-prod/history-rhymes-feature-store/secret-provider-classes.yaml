apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hr-feature-store-ingest
  namespace: winston-streaming
spec:
  provider: gke
  parameters:
    # Only DATABASE_URL (silver writes) + the already-provisioned FRED key.
    # Census / VIX (via FRED) / FOMC / DefiLlama are public — NO secrets.
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/winston-database-url/versions/latest"
        path: "database-url"
      - resourceName: "projects/PROJECT_ID/secrets/winston-fred-api-key/versions/latest"
        path: "fred-api-key"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: hr-feature-store-materializer
  namespace: winston-streaming
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/winston-database-url/versions/latest"
        path: "database-url"
