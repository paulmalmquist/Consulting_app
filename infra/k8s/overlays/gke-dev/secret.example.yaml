# TEMPLATE ONLY — do not commit a filled-in copy. The real Secret is created
# imperatively at deploy time so credentials never touch git:
#
#   kubectl create secret generic winston-bq-sink-secrets \
#     --namespace winston-events \
#     --from-literal=EVENTS_BROKER_URL='pkc-xxxxx.us-east1.gcp.confluent.cloud:9092' \
#     --from-literal=EVENTS_SASL_USERNAME='<confluent api key>' \
#     --from-literal=EVENTS_SASL_PASSWORD='<confluent api secret>' \
#     --from-literal=BQ_PROJECT_ID='paultest-d3cb1'
#
# BigQuery auth is via Workload Identity (the bound GCP SA), so there is NO
# service-account key in this Secret — only the broker URL, Confluent API
# key/secret, and the BQ project id.
apiVersion: v1
kind: Secret
metadata:
  name: winston-bq-sink-secrets
  namespace: winston-events
type: Opaque
stringData:
  EVENTS_BROKER_URL: "REPLACE_ME"
  EVENTS_SASL_USERNAME: "REPLACE_ME"
  EVENTS_SASL_PASSWORD: "REPLACE_ME"
  BQ_PROJECT_ID: "REPLACE_ME"
