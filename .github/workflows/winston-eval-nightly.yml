name: Winston Eval Nightly

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily (before perf-nightly at 06:00 UTC)
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: false
        default: "smoke"
        type: choice
        options: [smoke, full]
      trigger:
        description: "Trigger label recorded in Postgres"
        required: false
        default: "manual"
        type: choice
        options: [manual, schedule, post_deploy]

permissions:
  contents: write
  issues: write

jobs:
  eval:
    name: Run Winston eval (${{ matrix.target.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        target:
          - environment: meridian
            business_secret: WINSTON_EVAL_MERIDIAN_BUSINESS_ID
            env_secret: WINSTON_EVAL_MERIDIAN_ENV_ID
          - environment: novendor
            business_secret: WINSTON_EVAL_NOVENDOR_BUSINESS_ID
            env_secret: WINSTON_EVAL_NOVENDOR_ENV_ID

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STORAGE_BUCKET: documents
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      WINSTON_EVAL_ENVIRONMENT: ${{ matrix.target.environment }}
      WINSTON_EVAL_BUSINESS_ID: ${{ secrets[matrix.target.business_secret] || secrets.WINSTON_EVAL_BUSINESS_ID }}
      WINSTON_EVAL_ENV_ID: ${{ secrets[matrix.target.env_secret] || secrets.WINSTON_EVAL_ENV_ID }}
      AI_GATEWAY_ENABLED: "true"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: repo-b/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install repo-b dependencies
        run: |
          cd repo-b
          npm ci

      - name: Bootstrap pgvector in PostGIS container
        run: |
          POSTGIS_CID=$(docker ps -q --filter ancestor=postgis/postgis:16-3.5 | head -n 1)
          if [ -z "$POSTGIS_CID" ]; then
            echo "No running PostGIS container found"
            exit 1
          fi
          docker exec "$POSTGIS_CID" bash -lc "apt-get update -qq && apt-get install -y -qq postgresql-16-pgvector"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d app -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d app -At -c "SELECT extname FROM pg_extension WHERE extname = 'vector';" | grep -qx "vector"
          echo "pgvector bootstrap complete - vector extension confirmed in pg_extension"

      - name: Apply database schema
        run: make db:migrate

      - name: Sanity-check DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set"
            exit 1
          fi
          if [ -z "$WINSTON_EVAL_BUSINESS_ID" ]; then
            echo "::error::${{ matrix.target.business_secret }} secret is not set"
            exit 1
          fi
          if [ -z "$WINSTON_EVAL_ENV_ID" ]; then
            echo "::error::${{ matrix.target.env_secret }} secret is not set"
            exit 1
          fi
          echo "Secrets present."

      - name: Run Winston eval (${{ matrix.target.environment }})
        id: run_eval
        env:
          SUITE: ${{ inputs.suite || 'smoke' }}
          TRIGGER: ${{ inputs.trigger || 'schedule' }}
        run: |
          set -o pipefail
          mkdir -p artifacts/eval-loop
          python -m eval_loop.runner \
            --${SUITE} \
            --environment "$WINSTON_EVAL_ENVIRONMENT" \
            --persist-postgres \
            --persist-business-id "$WINSTON_EVAL_BUSINESS_ID" \
            --persist-env-id "$WINSTON_EVAL_ENV_ID" \
            --persist-trigger "$TRIGGER" \
            --regressions-out artifacts/eval-loop/regressions.json \
            --write-docs-report \
            | tee artifacts/eval-loop/runner.stdout.txt

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winston-eval-nightly-${{ matrix.target.environment }}-${{ github.run_id }}
          path: |
            artifacts/eval-loop/
            docs/ai-testing/reports/
          retention-days: 30

      - name: Open / update GitHub issue per regression
        if: always() && hashFiles('artifacts/eval-loop/regressions.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/eval_regressions_to_issues.py \
            --input artifacts/eval-loop/regressions.json \
            --repo "$GITHUB_REPOSITORY" \
            --suite "${{ inputs.suite || 'smoke' }}-${{ matrix.target.environment }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Commit docs report
        if: success()
        run: |
          git config user.name  "winston-eval[bot]"
          git config user.email "winston-eval@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/ai-testing/reports/ docs/LATEST.md 2>/dev/null)" ]; then
            git add docs/ai-testing/reports/ docs/LATEST.md || true
            git commit -m "chore(winston-eval): nightly ${{ matrix.target.environment }} report ${{ github.run_id }}" || true
            git push || echo "::warning::Push failed (likely branch protection). Report is still in artifacts."
          else
            echo "No docs report changes to commit."
          fi
