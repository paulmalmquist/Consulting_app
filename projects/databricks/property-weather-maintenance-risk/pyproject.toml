[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather_risk"
version = "0.3.0"
description = "Modular property weather maintenance risk pipeline (Databricks-ready, package-driven). Public NOAA/FEMA weather/hazard concepts + synthetic property operations data. Not HappyCo production data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Novendor" }]
keywords = ["databricks", "weather-risk", "property-operations", "maintenance-risk"]
dependencies = []

[project.optional-dependencies]
# Databricks runtime already provides pyspark + mlflow; these are for local
# experimentation only and are intentionally not required by the local path.
spark = ["pyspark>=3.5", "mlflow>=2.9"]
dev = ["pytest>=8.0"]

[project.scripts]
weather-risk = "weather_risk.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["weather_risk*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
